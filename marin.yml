schema: 1

project:
  name: Marin Learn
  repo: marin-learn
  type: app
  owner: County of Marin
  audience: staff
  status: alpha

platform:
  shell: 1.13.0

deployment:
  target: github-pages
  url: https://marincountygov.github.io/marin-learn/

# Declare whether the deployed app uses AI (not tools used to build it).
ai:
  used: false

# Outside services the deployed app uses (not the shared App Shell calls). Marin Learn
# runs entirely in the browser from its own files and calls no outside service.
services: none
