name: Check published files

# The site is served straight from the repository (GitHub Pages, branch main, root).
# This workflow does not deploy anything. An earlier version uploaded only the generated
# catalog as the whole site, which replaced the app with a page that had no scripts.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate template and security meta
        run: |
          python tests/validate_template.py
          python tests/test_security_meta.py
          python tests/test_publish.py

      - name: Check that learning/ and catalog.json match packages/
        run: python scripts/check_published.py
