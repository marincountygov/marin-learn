name: Build PowerPoint release candidate

on:
  workflow_dispatch:
    inputs:
      target:
        description: Release gate target
        required: true
        default: pilot
        type: choice
        options:
          - pilot
          - production

permissions:
  contents: read

concurrency:
  group: "pptx-release-candidate-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils imagemagick

      - name: Run repository checks
        run: bash scripts/check.sh

      - name: Build deterministic release fixture
        run: |
          mkdir -p build/pptx-fixtures
          python3 scripts/build_pptx_release_fixture.py \
            --out build/pptx-fixtures/pptx-release-conformance.zip \
            --summary build/pptx-fixtures/results.json

      - name: Generate release-candidate PowerPoint files
        run: |
          mkdir -p build/pptx-review
          set -o pipefail
          node scripts/generate_pptx.mjs \
            packages \
            build/pptx-fixtures/pptx-release-conformance.zip \
            --out build/pptx-review \
            --summary build/pptx-review/results.json \
            | tee build/pptx-review/generation.log

      - name: Run independent OOXML validation
        run: |
          set -o pipefail
          python3 scripts/validate_pptx.py build/pptx-review \
            --require-manifest \
            --write-sidecars \
            --out build/pptx-review/independent-validation.json \
            | tee build/pptx-review/independent-validation.log

      - name: Render release-candidate evidence
        run: |
          mkdir -p build/pptx-rendered
          set -o pipefail
          python3 scripts/render_pptx.py build/pptx-review \
            --out build/pptx-rendered \
            --summary build/pptx-rendered/render-results.json \
            | tee build/pptx-rendered/render.log

      - name: Initialize checksum-bound manual acceptance record
        run: |
          mkdir -p build/pptx-release
          python3 scripts/pptx_release_gate.py init \
            --review build/pptx-review \
            --render build/pptx-rendered \
            --target "${{ inputs.target }}" \
            --out build/pptx-release/manual-results.json

      - name: Upload PowerPoint release-candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marin-learn-pptx-release-candidate-${{ inputs.target }}-${{ github.run_number }}
          path: |
            build/pptx-fixtures
            build/pptx-review
            build/pptx-rendered
            build/pptx-release
          if-no-files-found: warn
          retention-days: 30
