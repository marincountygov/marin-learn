    <meta name="description" content="Learn through structured content, presentations, and quizzes.">

    <script src="vendor/marinos/marinos.js" defer></script>

  <body>
    <noscript>
      <div class="container app-alert app-alert--warning">
        JavaScript is required to display the MarinOS interface and use this application.
      </div>
    </noscript>

    <marin-os-banner></marin-os-banner>

    <marin-app-header app-name="Marin Learn" app-description="Learn through structured content, presentations, and quizzes.">
      <template data-icon>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/>
          <path d="M22 10v6"/>
          <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>
        </svg>
      </template>
    </marin-app-header>

    <main id="main" class="container app-main">
      <section id="start" class="app-page-heading" data-tab-section="start" aria-labelledby="start-heading">
        <h2 id="start-heading">Marin Learn Catalog</h2>
        <p>Discover published learning sets, training materials, slide presentations, and quizzes.</p>

        <div class="catalog-controls" role="region" aria-label="Catalog search and filters">
          <div class="catalog-search-group">
            <label for="catalog-search" class="catalog-label">Search learning sets</label>
            <input type="search" id="catalog-search" placeholder="Search title, abstract, or keywords..." aria-label="Search learning sets">
          </div>
          <div class="catalog-filter-group">
            <label for="level-filter" class="catalog-label">Educational Level</label>
            <select id="level-filter" aria-label="Filter by educational level">
              <option value="">All levels</option>
              <option value="introductory">Introductory</option>
              <option value="intermediate">Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>
          </div>
        </div>

        <div id="catalog-status" class="catalog-status" aria-live="polite">Loading catalog...</div>
        <div id="catalog-grid" class="catalog-grid" role="feed" aria-label="Learning sets list"></div>
      </section>

      <!-- Supply app-owned content only; the shell generates sections and headings. -->
      <marin-app-info app-name="Marin Learn" repo="marincountygov/marin-learn" security-src="security.json">
        <template data-about>
          <p>Marin Learn is a MarinOS application for discovering and consuming structured learning materials, slide presentations, and quizzes across County departments.</p>
        </template>
        <template data-accessibility>
          <p>Marin Learn conforms to WCAG 2.2 AA standards. All course views, documents, slide decks, and quizzes are fully keyboard-navigable with accessible headings, landmarks, and high-contrast support.</p>
        </template>
      </marin-app-info>
    </main>

    <marin-app-footer app-name="Marin Learn"></marin-app-footer>
    <marin-app-feedback></marin-app-feedback>
  </body>
</html>
