      <section id="start" data-tab-section="start" aria-label="Marin Learn">
        <div class="catalog-status" aria-live="polite">Loading Marin Learn…</div>
      </section>

      <template id="catalog-home-template">
        <h2 id="search-heading">Search</h2>

        <div class="catalog-controls" role="region" aria-label="Catalog search and filters">
          <div class="catalog-search-group">
            <label for="catalog-search" class="catalog-label">Search Marin Learn</label>
            <input type="search" id="catalog-search" placeholder="Search title, description, or keywords..." aria-label="Search Marin Learn">
          </div>
          <div class="catalog-filter-group">
            <label for="theme-filter" class="catalog-label">Theme</label>
            <select id="theme-filter" aria-label="Filter by theme">
              <option value="">All themes</option>
            </select>
          </div>
        </div>

        <div id="themes" role="group" aria-label="Themes" hidden>
          <div id="theme-badges"></div>
        </div>

        <h2 id="courses-heading">Catalog</h2>
        <div id="catalog-status" class="catalog-status" aria-live="polite">Loading Marin Learn…</div>
        <div id="catalog-grid" class="catalog-grid" aria-labelledby="courses-heading"></div>
      </template>

      <section id="support" class="support-section" data-tab-section="start" aria-labelledby="support-heading">
        <h2 id="support-heading">Help</h2>
        <div class="catalog-grid">
          <article class="app-card app-card--secondary course-card">

            <p>Get one-on-one help with a real decision, such as a service, purchase, or AI idea.</p>
          </article>
          <article class="app-card app-card--secondary course-card">
            <span class="app-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5.5 20H8"/><path d="M17 9h.01"/><rect width="10" height="16" x="12" y="4" rx="2"/><path d="M8 6H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h4"/><circle cx="17" cy="15" r="1"/></svg></span>

            <span class="app-card__icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 15h4"/><path d="m14.5 4.058.571-1.429a1 1 0 011.3-.558l5 2a1 1 0 01.549.534.88.88 0 01.01.765l-2.332 5.83"/><path d="M15.634 11a2 2 0 00-.186-.34l-1.17-1.757 1.31-1.656a2 2 0 00-2.109-3.165l-2.032.57-1.17-1.758a2 2 0 00-3.664 1.028l-.086 2.11-2.032.568a2 2 0 00-.155 3.8l1.617.6"/><path d="M4 12.006A1 1 0 014.994 11H19a1 1 0 011 1v7a2 2 0 01-2 2H6a2 2 0 01-2-2z"/></svg></span>

            <p>Work with your team on real County tasks and leave with a plan or prototype.</p>
          </article>
        </div>
      </section>

      <marin-app-info app-name="Marin Learn" repo="marincountygov/marin-learn" security-src="security.json">

          <p>Marin Learn offers short courses that help County staff build skills for better services. Each course has notes, slides, and a quiz.</p>
